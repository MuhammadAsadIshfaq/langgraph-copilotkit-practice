[tool.poetry]
name = "todo-agent"
version = "0.1.0"
description = "AI-powered todo application backend"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "todo_agent"}]
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.6.0"
langchain = "^0.1.0"
langgraph = "^0.0.10"
groq = "^0.4.2"
langchain-core = "^0.1.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^24.1.0"
isort = "^5.13.0"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api" 